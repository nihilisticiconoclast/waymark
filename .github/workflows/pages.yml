name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/walks/**", "data/ledger.json", "scripts/build_index.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r scripts/requirements.txt
      - run: |
          python scripts/build_index.py
          python scripts/brier.py --write
      - name: Write config.js from secrets
        run: |
          cat > site/config.js <<EOF
          window.WAYMARK_CONFIG = {
            basemap: "${{ vars.WAYMARK_BASEMAP || 'opentopo' }}",
            osApiKey: "${{ secrets.OS_API_KEY }}",
            cuddlyLampBase: "${{ vars.CUDDLY_LAMP_BASE }}"
          };
          EOF
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
