name: pages

on:
  push:
    branches: [main]
    # Includes this file: changing how the site is built or configured is a reason to
    # rebuild it. Without that, editing the deploy workflow does nothing until something
    # else happens to change, which is a confusing way to discover your settings are live.
    paths:
      - "site/**"
      - "data/walks/**"
      - "data/ledger.json"
      - "scripts/build_index.py"
      - "scripts/brier.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r scripts/requirements.txt
      - run: |
          python scripts/build_index.py
          python scripts/brier.py --write
      # One setting, not two. Adding an OS_API_KEY secret is the whole configuration: the
      # basemap follows from whether a key exists, because a key with no basemap setting and
      # a basemap setting with no key are both useless states and there is no reason to make
      # somebody hold them in their head. WAYMARK_BASEMAP stays as an optional override for
      # the one real choice — os-outdoor (free plan) versus os-leisure (Premium, and the
      # Explorer sheet) — and can be ignored entirely.
      #
      # Values arrive as environment variables rather than being interpolated into the script
      # text: a repository variable is settable by anyone with write access, and `${{ }}`
      # inside a run block is substituted before the shell ever sees it.
      - name: Write config.js
        env:
          BASEMAP_OVERRIDE: ${{ vars.WAYMARK_BASEMAP }}
          OS_API_KEY: ${{ secrets.OS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          key = os.environ.get("OS_API_KEY", "").strip()
          basemap = os.environ.get("BASEMAP_OVERRIDE", "").strip()
          if not basemap:
              basemap = "os-outdoor" if key else "opentopo"
          if basemap.startswith("os-") and not key:
              print("::warning::WAYMARK_BASEMAP asks for %s but OS_API_KEY is empty; "
                    "using OpenTopoMap." % basemap)
              basemap = "opentopo"
          # The file is written, not printed. A `>` redirect on this step put every log
          # annotation above the assignment inside config.js, which made the file a syntax
          # error, and a syntax error in config.js is silent: the browser discards it,
          # window.WAYMARK_CONFIG never exists, and app.js falls back to its keyless
          # default. A correct OS key published an OpenTopoMap site for a week that way.
          pathlib.Path("site/config.js").write_text(
              "window.WAYMARK_CONFIG = %s;\n"
              % json.dumps({"basemap": basemap, "osApiKey": key}))
          print("::notice::basemap=%s (OS key %s)"
                % (basemap, "present" if key else "absent"))
          PY
      # Nothing in the repository proves the generated file is loadable, and the failure mode
      # is invisible from the outside: a blank-looking config and a map that works, wrongly.
      # So parse it here and assert it is the one statement it is supposed to be.
      - name: Check config.js is loadable
        run: |
          node --check site/config.js
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("site/config.js").read_text().strip()
          if not re.fullmatch(r"window\.WAYMARK_CONFIG = \{.*\};", text, re.S):
              sys.exit("site/config.js is not a single WAYMARK_CONFIG assignment:\n"
                       + text[:400])
          print(re.sub(r'"osApiKey": "[^"]+"', '"osApiKey": "███"', text))
          PY
      # Stamp the commit onto every local asset URL. A browser that has cached a previous
      # app.js will otherwise keep running it against fresh HTML for as long as its cache
      # says so — and when the cached copy is a broken one, the site stays broken for the
      # person who most needs it fixed, with no way to tell from the outside.
      - name: Cache-bust the local assets
        run: |
          python - <<'PY'
          import pathlib, re, os
          sha = os.environ["GITHUB_SHA"][:8]
          p = pathlib.Path("site/index.html")
          html = p.read_text()
          html = re.sub(r'(\./(?:app|config|styles|vendor/[\w.]+)\.(?:js|css))"',
                        lambda m: f'{m.group(1)}?v={sha}"', html)
          html, n = re.subn(r'(<meta name="waymark-build" content=")dev(")',
                            lambda m: m.group(1) + sha + m.group(2), html)
          if n != 1:
              raise SystemExit("expected exactly one waymark-build meta tag, found %d" % n)
          p.write_text(html)
          print("stamped assets and build meta with", sha)
          PY

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
