name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/walks/**", "data/ledger.json", "scripts/build_index.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r scripts/requirements.txt
      - run: |
          python scripts/build_index.py
          python scripts/brier.py --write
      # Values arrive as environment variables rather than being interpolated into the
      # script text: a repository variable is settable by anyone with write access, and
      # `${{ }}` inside a run block is substituted before the shell ever sees it.
      # There is no cuddly-lamp setting — the stylesheet URL is fixed in index.html.
      - name: Write config.js
        env:
          BASEMAP: ${{ vars.WAYMARK_BASEMAP || 'opentopo' }}
          OS_API_KEY: ${{ secrets.OS_API_KEY }}
        run: |
          python - <<'PY' > site/config.js
          import json, os
          print("window.WAYMARK_CONFIG = %s;" % json.dumps({
              "basemap": os.environ.get("BASEMAP") or "opentopo",
              "osApiKey": os.environ.get("OS_API_KEY", ""),
          }))
          PY
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
