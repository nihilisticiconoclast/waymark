<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waymark — walks from Stroud</title>
<meta name="description" content="Curated walks around Stroud, surveyed from open data and written up by hand.">

<!-- Styling is owned by cuddly-lamp. Verified against cuddly-lamp/assets/tokens.css: one
     stylesheet, not two — there is no base.css — and the tokens are unprefixed: --paper,
     --ink, --contour, --index, --incident, --amber, --route, --font-display/body/data,
     --radius, --rule, --measure, --step--1 … --step-4. Linked from the CDN rather than
     copied, per cuddly-lamp SKILL.md §6: one source of truth, and an update there reaches
     this page without a commit here. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/nihilisticiconoclast/cuddly-lamp@main/assets/tokens.css">

<!-- Leaflet and Proj4 are vendored, not linked. They are load-bearing: without them there
     is no map at all, and a static site should not have three third-party origins standing
     between a walker and the thing they came for. cuddly-lamp stays on its CDN because that
     is the style guide's own rule and because styles.css carries a fallback if it 404s. -->
<link rel="stylesheet" href="./vendor/leaflet.css">
<link rel="stylesheet" href="./styles.css">
</head>

<body data-seed="waymark-stroud">
<div id="app">

  <!-- ── rail ─────────────────────────────────────────────────────────────────────── -->
  <aside id="rail" aria-label="Filters">
    <div id="rail-grip" role="button" tabindex="0" aria-label="Expand filters"></div>

    <!-- The per-page doodle. Its slot comes from TunnelFigure.placeDoodle against the rail,
         never a fixed corner. It sits behind the rail's content and shows only in the gaps
         between blocks — the map is opaque and full-bleed, so the rail is the only gutter
         this page has. -->
    <div class="doodle" id="doodle"></div>

    <header class="rail-head">
      <span class="sig" id="sig"></span>
      <div class="rail-title">
        <h1>Waymark</h1>
        <p class="rail-sub"><span id="count">0</span> of <span id="total">0</span> walks</p>
      </div>
    </header>

    <!-- Shown only while the corpus is empty, which is this site's expected state until the
         first survey runs. A blank map with no explanation reads as a broken one. -->
    <p class="state-note" id="state-note" hidden></p>

    <!-- The dial. Every walk is a dot in polar coordinates about Stroud. Drag across it to
         select a sector; the selection is a bearing range and a distance range at once. -->
    <section class="block" aria-labelledby="dial-h">
      <h2 id="dial-h">Where from Stroud</h2>
      <div id="dial-wrap">
        <svg id="dial" viewBox="-110 -110 220 220" role="application"
             aria-label="Bearing and distance selector. Drag to select a sector.">
          <g id="dial-rings"></g>
          <g id="dial-ticks"></g>
          <path id="dial-wedge" d=""></path>
          <g id="dial-dots"></g>
          <circle id="dial-origin" r="2.5" cx="0" cy="0"></circle>
        </svg>
      </div>
      <p class="dial-read" id="dial-read">All directions, any distance</p>
      <button type="button" class="link-btn" id="dial-clear">Clear the sector</button>
    </section>

    <section class="block" aria-labelledby="range-h">
      <h2 id="range-h">The walk itself</h2>

      <label class="range">
        <span>Distance <output id="out-dist">any</output></span>
        <input type="range" id="f-dist" min="0" max="30" step="1" value="30">
      </label>

      <label class="range">
        <span>Total ascent <output id="out-asc">any</output></span>
        <input type="range" id="f-asc" min="0" max="900" step="25" value="900">
      </label>

      <label class="range">
        <span>Steepest sustained <output id="out-grad">any</output></span>
        <input type="range" id="f-grad" min="0" max="30" step="1" value="30">
      </label>

      <label class="range">
        <span>Underfoot <output id="out-surf">any</output></span>
        <input type="range" id="f-surf" min="0" max="100" step="10" value="0">
        <small>Minimum share of the route that is unsealed.</small>
      </label>

      <label class="range">
        <span>Technicality at most <output id="out-tech">any</output></span>
        <input type="range" id="f-tech" min="1" max="5" step="1" value="5">
      </label>
    </section>

    <section class="block" aria-labelledby="need-h">
      <h2 id="need-h">Must have</h2>
      <div class="checks">
        <label><input type="checkbox" data-flag="nt"> National Trust land</label>
        <label><input type="checkbox" data-flag="car_park"> Car park at the start</label>
        <label><input type="checkbox" data-flag="car_park_free"> …and free</label>
        <label><input type="checkbox" data-flag="toilets"> Toilets</label>
        <label><input type="checkbox" data-flag="refreshment"> Somewhere to eat</label>
        <label><input type="checkbox" data-flag="vegan"> …with a vegan option</label>
        <label><input type="checkbox" data-flag="closed"> Circular</label>
        <label><input type="checkbox" data-flag="trig"> Trig point on route</label>
        <label><input type="checkbox" data-flag="transit"> Reachable by bus or train</label>
      </div>
    </section>

    <section class="block" aria-labelledby="queue-h">
      <h2 id="queue-h">The queue</h2>
      <div class="checks">
        <label><input type="checkbox" id="f-queue" checked> Show areas awaiting survey</label>
      </div>
      <small>Hollow markers. Not walks — nothing about them has been checked against the map
        yet, so they answer to the dial and to none of the filters above.</small>
    </section>

    <section class="block" aria-labelledby="run-h">
      <h2 id="run-h">Running</h2>
      <div class="checks">
        <label><input type="radio" name="run" value="" checked> Doesn't matter</label>
        <label><input type="radio" name="run" value="mostly"> Runnable for the most part</label>
        <label><input type="radio" name="run" value="throughout"> Runnable throughout</label>
      </div>
    </section>

    <section class="block" aria-labelledby="trust-h">
      <h2 id="trust-h">Trust</h2>
      <label class="range">
        <span>Confidence at least <output id="out-conf">any</output></span>
        <input type="range" id="f-conf" min="0" max="95" step="5" value="0">
      </label>
      <div id="calibration" class="calib" aria-live="polite"></div>
    </section>

    <footer class="rail-foot">
      <p id="attribution"></p>
    </footer>
  </aside>

  <!-- ── map ──────────────────────────────────────────────────────────────────────── -->
  <main id="map" aria-label="Map of walks"></main>

  <!-- ── detail ───────────────────────────────────────────────────────────────────── -->
  <article id="detail" hidden aria-live="polite">
    <button type="button" id="detail-close" aria-label="Close">×</button>
    <div id="detail-body"></div>
  </article>

</div>

<script src="./vendor/leaflet.js"></script>
<script src="./vendor/proj4.js"></script>
<script src="./vendor/proj4leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/gh/nihilisticiconoclast/cuddly-lamp@main/assets/tunnel-figure.js"></script>
<script>
/* The house signature: the mark is the fixed logo and is identical on every page in the
   family; the doodle is seeded from the page so it is stable across reloads and unlike any
   other page's. Guarded, because the site has to stay usable when the CDN is unreachable. */
(function () {
  if (typeof TunnelFigure === "undefined") return;
  document.getElementById("sig").innerHTML =
    TunnelFigure.tunnelFigureSVG(null, { variant: "mark" });
  var seed = document.body.dataset.seed || location.pathname || document.title;
  var doodle = document.getElementById("doodle");
  doodle.innerHTML = TunnelFigure.tunnelFigureSVG(seed, { variant: "doodle" });
  TunnelFigure.placeDoodle(doodle, { seed: seed });
})();
</script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
