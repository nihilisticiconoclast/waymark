# Target areas awaiting survey.
#
# The weekly job takes the highest-priority unsurveyed entry. Priority is a hint, not an
# ordering guarantee — the job will skip an entry whose Overpass query returns insufficient
# path density and move on rather than force a bad loop.
#
# `centre` is a search anchor, NOT a route start. survey.py finds the start.
# `distance_band_km` constrains loop assembly. Widen it if the assembler keeps failing.
#
# Deliberately spread across bearings so the dial has something to select. Roughly half the
# queue is inside 20 km — the honest truth is that most walks that actually happen are the
# close ones, and a corpus weighted toward Snowdonia would be aspirational furniture.

origin:
  name: Stroud
  lat: 51.7447
  lon: -2.2166
  note: The Cross. Change here and in site/app.js ORIGIN together.

